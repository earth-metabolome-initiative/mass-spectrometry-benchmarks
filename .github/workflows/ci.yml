name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "spectral-cosine-similarity/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "spectral-cosine-similarity/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spectral-cosine-similarity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: spectral-cosine-similarity -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check compilation
        run: cargo check --locked
      - name: Lint (strict)
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spectral-cosine-similarity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Syntax check scripts
        run: python3 -m compileall -q scripts
      - name: Ruff (strict)
        run: uv run --with ruff ruff check scripts
      - name: Mypy (strict)
        run: uv run --with mypy mypy scripts
      - name: Import smoke check
        run: uv run python3 -c "import matchms"
      - name: Tiny pipeline integration test
        run: cargo test --locked --features python-tests --test pipeline_fast
