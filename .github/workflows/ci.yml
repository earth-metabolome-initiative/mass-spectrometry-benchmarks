name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "spectral-cosine-similarity/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "spectral-cosine-similarity/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spectral-cosine-similarity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: spectral-cosine-similarity -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check compilation
        run: cargo check --locked
      - name: Lint (strict)
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spectral-cosine-similarity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Syntax check scripts
        run: python3 -m compileall -q scripts
      - name: Ruff (strict)
        run: uv run --with ruff ruff check scripts
      - name: Mypy (strict)
        run: uv run --with mypy mypy scripts
      - name: Import smoke check
        run: uv run python3 -c "import matchms"
      - name: Tiny pipeline integration test
        run: cargo test --locked --features python-tests --test pipeline_fast
